<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#0b2a20;color:#f1efe4;font-family:"Trebuchet MS",Verdana,sans-serif;min-height:100vh;display:flex;justify-content:center}
button{font:inherit;color:inherit;border:0;cursor:pointer}

.acts .biz{grid-column:1/3;background:#9b7ede;color:#fff}.acts .biz small{color:#e7dcff}
.acts .car{grid-column:1/3;background:#e9c46a;color:#0b2a20}.acts .car small{color:#5b4a1a}
.acts .hl{grid-column:1/3;background:#e76f51;color:#fff}.acts .hl small{color:#ffe1d6}

.frame{width:100%;max-width:380px;height:min(680px,96vh);background:#000;border:8px solid #2b2f33;border-radius:34px;display:flex;flex-direction:column;overflow:hidden}

.tabs{overflow-x:auto}.tabs button{flex:none;padding:11px 13px;background:none;color:#8b98a5;font-weight:bold;white-space:nowrap}
.tabs button.on{color:#fff;border-bottom:3px solid #1d9bf0}
.scr{flex:1;overflow-y:auto;padding:0 0 10px}
.compose{display:flex;flex-direction:column;gap:7px;padding:12px;border-bottom:1px solid #2f3336}
.compose p{font-size:13px;color:#8b98a5}
.compose button{padding:9px 12px;border-radius:18px;background:#16181c;border:1px solid #2f3336;color:#e7e9ea;text-align:left;font-size:14px}
.tw{padding:11px 14px;border-bottom:1px solid #2f3336;font-size:14px;line-height:1.35;color:#e7e9ea}
.tw b{color:#fff}.tw em{color:#71767b;font-style:normal;margin-left:5px}
.tw .lk{display:block;margin-top:5px;color:#71767b;font-size:12px}
.shop{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px;border-bottom:1px solid #2f3336;color:#e7e9ea;font-size:14px}
.shop small{display:block;color:#71767b}
.shop button{background:#1d9bf0;color:#fff;padding:8px 14px;border-radius:16px;font-weight:bold}
.sub{padding:10px 14px 4px;color:#8b98a5;font-size:13px}.bb{max-width:80%;padding:8px 11px;border-radius:14px;margin:6px 12px;font-size:14px;line-height:1.3;color:#fff}.bb.t{background:#2f3336}.bb.m{background:#1d9bf0;margin-left:auto}
.close{margin:8px;padding:12px;border-radius:20px;background:#2b2f33;color:#fff;font-weight:bold}
#match{flex-direction:column;gap:8px;touch-action:none}
#hud{display:flex;justify-content:space-between;width:min(360px,92vw);font-weight:bold;font-size:17px}
#hud span:last-child{color:#ffd23f}
canvas{width:min(360px,92vw);height:auto;aspect-ratio:360/520;max-height:72vh;border-radius:10px;touch-action:none;background:#2e8b57}
#btns{display:flex;gap:8px;width:min(360px,92vw)}#btns button{flex:1;padding:14px;border-radius:30px;background:#6fb7ff;color:#0b2a20;font-weight:bold;font-size:17px}#btns #shoot{background:#ffd23f}
.pn h2{font-size:20px}.pn .st{font-size:13px;color:#b9cfc4}.pn{max-height:92vh;overflow-y:auto}
.pn{width:min(380px,92vw);background:#123a2d;border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px}.pn p{font-size:16px;line-height:1.4}.pn button{padding:13px;border-radius:12px;background:#1b5a44;font-weight:bold;text-align:left;font-size:16px}.pn button small{display:block;font-weight:normal;font-size:12px;color:#b9cfc4;margin-top:3px}

<div id="talk" class="ov"><div class="pn"><p id="talkq"></p><p id="talkr"></p>

<div id="end" class="ov"><div class="pn" id="endp"></div></div>

<script>
const $=s=>document.querySelector(s);
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let S=null,curTab=1;

/* ---------- Tiempo unificado ----------
   S.day es el unico reloj. Todo lo demas (dia de temporada, semana, fin de temporada) se deriva aqui. */
const SEASON=60,WEEK=7;
const Time={
  SEASON,WEEK,
  nextDay(){S.day++;return S.day;},
  dayOfSeason:()=>(S.day-1)%SEASON+1,
  week:()=>Math.floor((S.day-1)/WEEK)+1,
  weekOfSeason:()=>Math.floor((Time.dayOfSeason()-1)/WEEK)+1,
  daysLeft:()=>SEASON-Time.dayOfSeason(),
  seasonEnded:()=>S.day>1&&(S.day-1)%SEASON===0
};

/* ---------- Guardado: 3 ranuras + version ----------
   Para cambiar la estructura de S: sube VER y agrega MIG[versionVieja]=s=>sNueva. */
const Save=(()=>{
  const VER=2,N=3,PRE="vida_de_crack_slot",ACT="vida_de_crack_active",LEGACY="vida_de_crack_v1",DONE="vida_de_crack_migrated";
  const MIG={1:s=>s};
  const ls=(f,d)=>{try{return f()}catch(e){return d}};
  let active=1;
  const key=n=>PRE+n;
  const raw=n=>ls(()=>JSON.parse(localStorage.getItem(key(n))),null);
  const meta=s=>({name:s.name,season:s.season,age:s.age,club:(typeof LG!=="undefined"&&LG[s.club])?LG[s.club].n:""});
  const migrate=d=>{let v=d.v||1,s=d.s;while(v<VER){s=(MIG[v]||(x=>x))(s);v++;}return s;};
  return {
    VER,N,
    get active(){return active},
    init(){
      active=+ls(()=>localStorage.getItem(ACT),1)||1;
      ls(()=>{
        const old=localStorage.getItem(LEGACY);
        if(old&&!localStorage.getItem(key(1))&&!localStorage.getItem(DONE)){
          localStorage.setItem(key(1),JSON.stringify({v:1,t:Date.now(),s:JSON.parse(old)}));
          localStorage.setItem(DONE,"1");active=1;localStorage.setItem(ACT,"1");
        }
      });
    },
    use(n){active=n;ls(()=>localStorage.setItem(ACT,String(n)));},
    write(){ls(()=>localStorage.setItem(key(active),JSON.stringify({v:VER,t:Date.now(),m:meta(S),s:S})));},
    read(n=active){const d=raw(n);return d?Object.assign(extras(),migrate(d)):null;},
    remove(n){ls(()=>localStorage.removeItem(key(n)));},
    list(){return Array.from({length:N},(_,i)=>{const d=raw(i+1);return {n:i+1,m:d?meta(d.s):null};});}
  };
})();
function load(){return Save.read();}
function save(){Save.write();}
function resetGame(){openSlots();}
function openSlots(){$('#slots').classList.add('on');slotsUI();}
function closeSlots(){$('#slots').classList.remove('on');}
function slotGo(n,a){
  if(a==="del"){if(!confirm("¿Borrar la partida de la ranura "+n+"?"))return;Save.remove(n);if(n===Save.active)location.reload();else slotsUI();return;}
  Save.use(n);location.reload();
}
function slotsUI(){
  $('#slp').innerHTML='<h2>Partidas</h2>'+Save.list().map(x=>{
    const m=x.m,on=x.n===Save.active;
    return '<p class="st">Ranura '+x.n+(on?' (activa)':'')+': '+(m?esc(m.name+' · Temporada '+m.season+' · '+m.age+' años'+(m.club?' · '+m.club:'')):'vacía')+'</p>'
      +(m?(on?'':'<button onclick="slotGo('+x.n+')">Continuar</button>')+'<button onclick="slotGo('+x.n+',\'del\')">Borrar</button>':'<button onclick="slotGo('+x.n+')">Empezar aquí</button>');
  }).join('')+'<button onclick="closeSlots()">Cerrar</button>';
}

function fresh(){
  let n="";
  try{n=prompt("¿Cómo se llama tu jugador?")||""}catch(e){}
  return Object.assign(extras(),{name:n.trim().slice(0,16)||"Crack",day:1,energy:100,fit:10,skill:10,fol:120,money:200,rep:50,goals:0,matches:0,feed:[],msg:"Eres un chico de barrio con un sueño. Entrena, juega y cuida tu fama."});
}
function say(t){S.msg=t;render();save();}
function clampStats(){S.energy=cl(S.energy,0,100);S.fit=cl(S.fit,0,100);S.skill=cl(S.skill,0,100);S.rep=cl(S.rep,0,100);S.stress=cl(S.stress,0,100);S.fam=cl(S.fam,0,10);S.fri=cl(S.fri,0,10);S.fol=Math.max(0,Math.round(S.fol));}
function extras(){return {ig:[],tt:[],chat:{mama:[],rep:[],dt:[]},pend:{mama:null,rep:null,dt:null},news:[],prof:[],profDay:0,partner:"",love:0,igD:0,ttD:0,stress:20,diet:0,hungDay:0,fam:3,fri:3,ex:"",lastLove:0,house:0,cars:[],pets:[],spons:[],rest:0,brand:0,brandBoost:0,
  age:17,club:0,ctr:3,season:1,sg:0,sw:0,sm:0,titles:0,bd:0,nat:false,wc:null,wcReach:0,wcTitles:0,moved:-99,retired:false,inj:null,injN:0,sev3:0,surgs:0,ban:0,susp:0,trace:0,tests:0,pos:0,burn:0,lates:0,clubsN:1,scand:0,diary:[],diaD:0};}
function newCareer(){
  ["end","car","hl","soc","biz","lig","phone","ev","int","talk"].forEach(i=>$('#'+i).classList.remove('on'));
  S=fresh();hookRep();tweetWelcome();dj("Empieza tu camino: eres un chico de barrio con un sueño.",1);render();save();
}

/* ---------- Twitter ---------- */
const FANS=[["Hincha Fiel","@fiel10"],["María Fútbol","@maria_fut"],["El Criticón","@criticon99"],["Barrio FC","@barriofc"],["Prensa Deportiva","@prensadep"],["Tío Chucho","@tiochucho"]];
function tweet(user,handle,text){
  S.feed.unshift({u:user,h:handle,t:text,l:Math.floor(Math.random()*40+S.fol/20),d:S.day});
  S.feed=S.feed.slice(0,40);
}
function fan(text){const f=rnd(FANS);tweet(f[0],f[1],text);}
function tweetWelcome(){tweet("Barrio FC","@barriofc","Nuestro chico del barrio, "+S.name+", empieza su camino. ¡Todos con él!");newMsg("mama",0);newMsg("rep",0);newsDay();}
const POST=[
  {t:"Agradecer a la afición",f:()=>{S.fol+=15;S.rep+=1;tweet(S.name,"@"+S.name.toLowerCase().replace(/\W/g,""),"Gracias a todos por el apoyo. ¡Seguimos trabajando!");fan("Así se habla, "+S.name+". Un crack humilde.");}},
  {t:"Subir foto del entrenamiento",f:()=>{S.fol+=25;tweet(S.name,"@"+S.name.toLowerCase().replace(/\W/g,""),"Día "+S.day+": sudor y disciplina.");fan("Ese físico no se hace solo. Respeto.");}},
  {t:"Lanzar un tuit polémico",f:()=>{tweet(S.name,"@"+S.name.toLowerCase().replace(/\W/g,""),"Hay quienes hablan mucho y juegan poco...");if(Math.random()<.5){S.fol+=120;S.rep-=3;fan("🔥 "+S.name+" se volvió tendencia por su tuit.");}else{S.fol-=40;S.rep-=8;fan("Qué mal gusto el tuit de "+S.name+". Se le fue la mano.");}}}
];
function post(i){POST[i].f();clampStats();render();save();}


/* ---------- Teléfono ---------- */
const APPS=[["Twitter",1],["Insta",2],["TikTok",3],["Chats",4],["Citas",5],["Noticias",6],["Tienda",7],["Diario",8]];
const NAMES={mama:"Mamá",rep:"Rafa (representante)",dt:"Profe Gómez (DT)"};
let curChat="mama";
function unread(){return ["mama","rep","dt"].filter(w=>S.pend[w]!==null).length;}
function openPhone(){$('#phone').classList.add('on');tab(curTab);}
function closePhone(){$('#phone').classList.remove('on');render();}
function after(n){clampStats();save();render();tab(n);}

/* chats */
const CH={
 mama:[
  {m:"Hijo, ¿ya comiste? No quiero verte flaco otra vez.",o:[["Sí, mamá, ya comí",()=>{S.energy+=5;S.rep+=1;return "Tu mamá se quedó tranquila."}],["No tengo tiempo, mamá",()=>{S.rep-=1;return "Tu mamá suspiró y colgó preocupada."}]]},
  {m:"Tu tía necesita ayuda con la renta. Son $100, ¿puedes?",o:[["Claro, les mando",()=>{if(S.money<100)return "Quisiste ayudar pero no te alcanzó el dinero.";S.money-=100;S.rep+=3;return "Mandaste $100. Tu familia está orgullosa."}],["Ahora no puedo",()=>{S.rep-=2;return "Tu mamá se quedó callada."}]]},
  {m:"Vi tu último partido por la tele. ¡No te olvides de dónde vienes!",o:[["Nunca, mamá. Te quiero",()=>{S.rep+=2;return "A tu mamá se le salieron las lágrimas."}],["Mamá, estoy ocupado",()=>{S.rep-=1;return "Tu mamá no insistió."}]]}
 ],
 rep:[
  {m:"Crack, una marca de bebidas ofrece $800 por una foto tuya. ¿Acepto?",o:[["Acepta",()=>{S.money+=800;S.fol+=40;return "Cobraste $800 del patrocinio."}],["Prefiero no",()=>{S.rep+=1;return "Rechazaste el patrocinio. Rafa no estuvo feliz."}]]},
  {m:"Un club de otro país preguntó por ti. Si rindes, me vuelven a llamar.",o:[["Genial, a trabajar",()=>{S.skill+=1;return "Te motivaste: más técnica."}],["Pide más dinero",()=>{S.rep-=1;return "Rafa dijo que lo intentará, pero no prometió nada."}]]},
  {m:"La prensa te está mirando. Cuida lo que subes a las redes.",o:[["Tienes razón",()=>{S.rep+=2;return "Decidiste ser más prudente."}],["Yo hago lo que quiero",()=>{S.rep-=2;S.fol+=30;return "Rafa se encogió de hombros."}]]}
 ],
 dt:[
  {m:"Mañana quiero verte puntual en el entrenamiento.",o:[["Sí, profe",()=>{S.rep+=1;return "El Profe Gómez asintió."}],["Voy si me da tiempo",()=>{S.rep-=2;return "El Profe Gómez anotó tu respuesta."}]]},
  {m:"Te vi cansado en el último partido. Duerme más.",o:[["Tiene razón, profe",()=>{S.energy+=10;return "Te tomaste el consejo en serio."}],["Estoy bien",()=>{S.fit-=1;return "El Profe Gómez no se lo creyó."}]]},
  {m:"¿Quieres que te ponga de delantero? Te veo con hambre de gol.",o:[["Sí, profe",()=>{S.skill+=2;return "Entrenaste tiros toda la semana: técnica +2."}],["Prefiero el mediocampo",()=>{S.fit+=2;return "Corriste más: físico +2."}]]}
 ]
};
function newMsg(w,i){
  if(S.pend[w]!==null)return;
  if(i===undefined)i=Math.floor(Math.random()*CH[w].length);
  S.pend[w]=i;S.chat[w].push({f:"t",t:CH[w][i].m});S.chat[w]=S.chat[w].slice(-12);
}
function replyChat(w,j){
  const c=CH[w][S.pend[w]];
  S.chat[w].push({f:"m",t:c.o[j][0]});S.pend[w]=null;
  S.msg=c.o[j][1]();after(4);
}

/* Instagram */
const IG=[{n:"Selfie del entrenamiento",f:20,r:1},{n:"Foto en la playa",f:40,r:0},{n:"Foto con tu pareja",f:70,r:2,p:1}];
function ig(i){
  const x=IG[i];
  if(S.igD===S.day){S.msg="Ya subiste algo a Instagram hoy. Vuelve mañana.";return after(2);}
  if(x.p&&!S.partner){S.msg="No tienes pareja para subir esa foto.";return after(2);}
  const l=Math.floor(S.fol*(.2+Math.random()*.4))+5;
  S.igD=S.day;S.fol+=Math.floor(S.fol*.02)+x.f;S.rep+=x.r;
  S.ig.unshift({t:x.n,l:l,d:S.day});S.ig=S.ig.slice(0,12);
  S.msg="Publicaste: "+x.n.toLowerCase()+". Recibió "+l+" me gusta.";after(2);
}

/* TikTok */
const TT=[{n:"Baile con tus compañeros",p:()=>.55},{n:"Reto de malabares con el balón",p:()=>.2+S.skill/120},{n:"Tutorial de tiro libre",p:()=>.5}];
function tt(i){
  const x=TT[i];
  if(S.ttD===S.day){S.msg="Ya subiste un TikTok hoy. Vuelve mañana.";return after(3);}
  if(S.energy<10){S.msg="Estás muy cansado para grabar.";return after(3);}
  S.energy-=10;S.ttD=S.day;
  if(Math.random()<x.p()){
    const v=Math.floor(S.fol*(5+Math.random()*20))+500;
    S.fol+=80+Math.floor(Math.random()*150);S.rep+=1;
    S.tt.unshift({t:x.n,v:v,d:S.day});S.msg="¡Se hizo viral! "+v+" vistas.";
    fan("El TikTok de "+S.name+" está en todas partes. ¡Qué crack!");
  }else{
    const v=Math.floor(S.fol*Math.random())+20;
    S.fol+=10;S.rep-=1;S.tt.unshift({t:x.n,v:v,d:S.day});S.msg="Casi nadie lo vio y algunos se burlaron.";
  }
  S.tt=S.tt.slice(0,12);after(3);
}

/* Citas */
function profiles(){
  if(S.profDay!==S.day){
    const N=["Valeria","Camila","Sofía","Daniela","Luciana","Andrea","Paula","Mariana","Isabela","Renata"];
    const B=["Le encanta el fútbol","Estudia medicina","Fotógrafa de viajes","Bailarina","Chef de un restaurante","Hincha del equipo rival","Odia el fútbol y ama la playa"];
    S.prof=[0,1,2].map(()=>({n:rnd(N),b:rnd(B)}));S.profDay=S.day;
  }
  return S.prof;
}
function invite(i){
  const p=S.prof[i];
  if(S.energy<15||S.money<150){S.msg=S.energy<15?"Estás muy cansado para una cita.":"Una cita cuesta $150 y no te alcanza.";return after(5);}
  S.energy-=15;S.money-=150;
  if(S.partner){
    if(Math.random()<.5){
      S.rep-=15;S.fol+=80;
      S.msg="¡Te pillaron con "+p.n+"! "+S.partner+" te dejó y salió en la prensa.";
      tweet("Prensa Deportiva","@prensadep","ESCÁNDALO: "+S.name+" fue visto con "+p.n+" y terminó con "+S.partner+".");
      S.ex=S.partner;S.partner="";S.love=0;
    }else{S.rep-=2;S.msg="Saliste con "+p.n+" y nadie se enteró. Esto es peligroso.";}
  }else if(Math.random()<Math.min(.85,.3+S.fol/2500+S.rep/300)){
    S.partner=p.n;S.love=1;S.lastLove=S.day;if(S.ex===p.n)S.ex="";dj("Empezaste a salir con "+p.n+".",1);S.rep+=2;S.msg="¡"+p.n+" aceptó! Ahora son pareja.";
    fan("Dicen que "+S.name+" anda con "+p.n+". ¡Qué bonita pareja!");
  }else{S.msg=p.n+" te dejó en visto.";}
  S.prof.splice(i,1);after(5);
}
function dinner(){
  if(S.energy<10||S.money<150){S.msg="Necesitas $150 y 10 de energía para una cena.";return after(5);}
  S.energy-=10;S.money-=150;S.lastLove=S.day;S.love=Math.min(10,S.love+1);S.rep+=3;
  S.msg="Cena romántica con "+S.partner+". Su relación va mejor: nivel "+S.love+".";after(5);
}
function breakUp(){
  if(!confirm("¿Terminar con "+S.partner+"?"))return;
  S.msg="Terminaste con "+S.partner+".";S.ex=S.partner;S.partner="";S.love=0;S.rep-=1;after(5);
}

function train(k){
  if(S.energy<25)return say("Estás agotado. Duerme o descansa antes de entrenar.");
  if(S.inj)return say("Estás lesionado ("+S.inj.n+"). No puedes entrenar: haz fisioterapia y descansa.");
  S.energy-=25;if(trainInjury())return;
  let g=2+Math.floor(Math.random()*3)+(S.diet>0?1:0);
  const late=Math.random()<Math.min(.8,.08+(S.energy<40?.2:0)+(S.hungDay===S.day?.45:0));
  let ex="";
  if(late){
    const f=Math.min(200,S.money);S.money-=f;S.rep-=3;S.stress+=5;g=Math.max(1,Math.floor(g/2));
    ex=" Llegaste tarde: multa de $"+f+" y el DT se molestó.";S.lates++;if(S.lates>=3){S.lates=0;S.susp+=3;S.money=Math.max(0,S.money-500);S.scand++;ex+=" Es la tercera vez: el club te suspendió 3 días y te multó $500.";dj("Suspendido 3 días por impuntualidad.",1);}
    newMsg("dt",0);

  else{S.skill+=g;S.msg="Tiros extra: tu técnica sube +"+g+"."+ex;}
  if(!late&&Math.random()<.25)fan("Vi a "+S.name+" entrenando duro. Eso se nota en la cancha.");

}

let G=null;const keys={};let joy=null,origin=null,pendRival=null,pendKind="club",IV=null;
const goalL=130,goalR=230;
const RIVALS=[["Rayo del Sur",["Pacheco","Montoya","Ríos"]],["Atlético Puerto",["Vega","Cruz","Salas"]],["Deportivo Norte",["Mejía","Lara","Ortiz"]],["Sporting Estrella",["Bravo","Paz","Luna"]],["Real Montaña",["Soto","Pinto","Ferro"]]];
const NATS=["Brasil","Argentina","Francia","Alemania","España","Inglaterra","Uruguay","Países Bajos","Italia","Portugal","Japón","Marruecos","México","Croacia"];
const SUR=["Rojas","Hoffmann","Silva","Tanaka","Dubois","Rossi","Costa","Haddad","Ivanov","Okafor","Moreau","Duarte"];

const DPOS=[[70,260],[180,200],[290,260]],TPOS=[[100,400],[260,400]];
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);

function startMatch(kind,force){
  kind=(kind==="nat"||kind==="wc")?kind:"club";
  if(kind==="club"){const r=League.gate();if(r)return say(r);}
  if(kind==="nat"&&!League.fifa())return say("Los amistosos con la selección solo se juegan en fecha FIFA: días 27 y 51 de la temporada.");
  if(S.energy<30)return say("Estás muy cansado para jugar. Duerme o recupérate.");
  if(S.ban>0)return say("Estás sancionado por dopaje: te quedan "+S.ban+" días sin poder jugar.");
  if(S.susp>0)return say("Estás suspendido por sanción disciplinaria: "+S.susp+" día(s) más.");
  if(S.burn>0)return say("Estás en pausa médica por agotamiento mental: "+S.burn+" día(s) más.");
  if(S.inj&&force!==true){
    ask("Estás lesionado ("+S.inj.n+", "+S.inj.d+" días de baja). ¿Juegas igual?",[
      ["No jugar","descansas y te recuperas",()=>"Decidiste no arriesgarte y seguir con la recuperación."],
      ["Jugar infiltrado","$200, riesgo alto de empeorar la lesión",()=>{if(S.money<200)return "No te alcanza para la infiltración.";S.money-=200;startMatch(kind,true);return "Te infiltraron la lesión para salir a jugar.";}]
    ]);
    return;
  }
  S.energy-=30;pendKind=kind;
  if(kind==="club")pendRival=League.rival();
  else pendRival=[rnd(NATS),SUR.slice().sort(()=>Math.random()-.5).slice(0,3)];
  $('#talkq').textContent=(kind==="club"?"Profe Gómez":"Seleccionador")+": “"+rnd(TALKS)+"”";
  $('#talkr').textContent=(kind==="wc"?WST[S.wc.st]+" del Mundial. ":kind==="nat"?"Amistoso con la selección. ":"")+"Hoy juegas contra "+pendRival[0]+". ¿Cómo sales a la cancha?";
  $('#talk').classList.add('on');
}
function kickoff(mode){
  $('#talk').classList.remove('on');
  if(mode==2){S.stress-=15;clampStats();}
  if(mode==3&&League.lu){League.lu.out=1;S.energy=Math.min(100,S.energy+10);}
  const r=pendRival,m=MATES.slice().sort(()=>Math.random()-.5);
  const lvl=1+Math.min(S.matches,20)*0.12+(LG[S.club].t-1)*0.4+(pendKind==="wc"?.4+.15*S.wc.st:pendKind==="nat"?.4:0);
  G={t:60,score:0,mine:0,ast:0,mode:mode,kind:pendKind,hurt:!!S.inj,hurtNow:false,rival:r[0],last:performance.now(),lvl:lvl,nopick:0,passTo:-1,lastP:99,
     p:{x:180,y:470,fx:0,fy:-1,stun:0,yc:0},
     b:{x:180,y:458,vx:0,vy:0,own:true,tm:-1,by:"p"},
     k:{x:180},ref:{x:250,y:300},
     tm:[{x:100,y:400,n:m[0],h:0},{x:260,y:400,n:m[1],h:0}],
     d:r[1].map((n,i)=>({x:DPOS[i][0],y:DPOS[i][1],cd:0,n:n,yc:0,out:false})),
     flash:0,ft:"",txt:"",txtT:0,off:false};
  if(pendKind==="club"&&League.lu)G.t=League.lu.st?(League.lu.out?40:60):30;
  $('#match').classList.add('on');
  requestAnimationFrame(loop);
}
function resetPlay(){
  const g=G,p=g.p,b=g.b;
  p.x=180;p.y=470;p.stun=0;b.own=true;b.tm=-1;b.vx=b.vy=0;b.by="p";g.passTo=-1;
  g.d.forEach((d,i)=>{d.x=DPOS[i][0];d.y=DPOS[i][1];d.cd=0;});
  g.tm.forEach((t,i)=>{t.x=TPOS[i][0];t.y=TPOS[i][1];t.h=0;});
}
function note(t){G.txt=t;G.txtT=2.4;}
function shoot(){
  if(!G||!G.b.own)return;G.sh=(G.sh||0)+1;
  const p=G.p,b=G.b,pw=6+S.skill*0.05+(G.mode==0?1.2:0)+((S.post||0)==0?.8:0);
  let vx=p.fx,vy=p.fy;
  if(p.fy<-0.3&&p.y<340){
    const tx=goalL+10+Math.random()*(goalR-goalL-20)-p.x,ty=-p.y,m=Math.hypot(tx,ty);
    vx=tx/m;vy=ty/m;
  }
  b.own=false;b.vx=vx*pw;b.vy=vy*pw;b.by="p";G.nopick=.35;G.passTo=-1;
}
function pass(){
  const g=G;if(!g||!g.b.own)return;g.ps=(g.ps||0)+1;
  const b=g.b;let best=0,bs=-1e9;
  g.tm.forEach((t,i)=>{
    const free=Math.min(999,...g.d.filter(d=>!d.out).map(d=>dist(d,t)));
    const sc=free*0.6-t.y*0.4;if(sc>bs){bs=sc;best=i;}
  });
  const t=g.tm[best],m=Math.hypot(t.x-b.x,t.y-b.y)||1;
  b.own=false;const sp=(S.post||0)==1?7.5:6.5;b.vx=(t.x-b.x)/m*sp;b.vy=(t.y-b.y)/m*sp;b.by="p";
  g.passTo=best;g.nopick=.3;g.lastP=0;
}
function tshoot(i){
  const g=G,b=g.b,t=g.tm[i];
  const tx=goalL+10+Math.random()*(goalR-goalL-20)-t.x,ty=-t.y,m=Math.hypot(tx,ty);
  b.tm=-1;b.vx=tx/m*6.5;b.vy=ty/m*6.5;b.by="t";g.nopick=.4;g.passTo=-1;
}
function tpass(){
  const g=G,b=g.b,p=g.p,m=Math.hypot(p.x-b.x,p.y-b.y)||1;
  b.tm=-1;b.vx=(p.x-b.x)/m*6;b.vy=(p.y-b.y)/m*6;b.by="t";g.nopick=.2;g.passTo=-1;
}
function tackle(d,who){
  const g=G,b=g.b,p=g.p,seen=dist(g.ref,d)<170;
  d.cd=1.6;
  if(Math.random()<(seen?.4:.1)){
    d.yc++;
    if(d.yc>=2){d.out=true;note("🟥 "+d.n+" expulsado por doble amarilla");}
    else note("🟨 Falta de "+d.n+". Tarjeta amarilla");
    d.cd=2;d.y=Math.max(60,d.y-45);
    return;
  }
  g.lastP=99;
  if(who==="p"){b.own=false;p.stun=g.mode==1?.4:.7;}else{b.tm=-1;}
  if(who==="p"&&Math.random()<injRisk()+(g.hurt?.12:0))g.hurtNow=true;
  b.vx=(Math.random()-.5)*8;b.vy=3+Math.random()*3;g.nopick=.5;
  if(who==="p"&&S.stress>55&&Math.random()<.4){
    p.yc++;
    if(p.yc>=2){g.off=true;note("🟥 Te expulsaron por protestar");}
    else note("🟨 Amarilla para ti por protestar");
  }
}
function step(dt){
  const g=G,p=g.p,b=g.b,k=dt*60;
  g.t-=dt;g.nopick=Math.max(0,g.nopick-dt);g.flash=Math.max(0,g.flash-dt);g.txtT=Math.max(0,g.txtT-dt);g.lastP+=dt;
  if(g.t<=0||g.off||g.hurtNow){endMatch();return}
  let dx=(keys.arrowright||keys.d?1:0)-(keys.arrowleft||keys.a?1:0);
  let dy=(keys.arrowdown||keys.s?1:0)-(keys.arrowup||keys.w?1:0);
  if(joy){dx=joy.x;dy=joy.y;}
  const sp=(2+S.fit*0.02+(S.diet>0?.2:0))*(S.stress>70?.85:1)*(g.mode==0?1.08:1)*(S.day-S.moved<10?.93:1)*(g.hurt?.8:1)*(S.trace>15?1.1:1);
  if(p.stun>0){p.stun-=dt;}
  else if(dx||dy){const m=Math.hypot(dx,dy);dx/=m;dy/=m;p.x+=dx*sp*k;p.y+=dy*sp*k;p.fx=dx;p.fy=dy;}
  p.x=cl(p.x,10,350);p.y=cl(p.y,12,508);
  /* balón */
  if(b.own){b.x=p.x+p.fx*13;b.y=p.y+p.fy*13;}
  else if(b.tm>=0){const t=g.tm[b.tm];b.x=t.x;b.y=t.y-12;}
  else{
    b.x+=b.vx*k;b.y+=b.vy*k;
    const f=Math.pow(.97,k);b.vx*=f;b.vy*=f;
    if(b.y<6&&b.x>goalL&&b.x<goalR){
      g.score++;g.flash=1.2;
      if(b.by==="p"){g.mine++;S.goals++;g.ft="¡GOOOL!";}
      else{g.ft="¡GOL!";if(g.lastP<4){g.ast++;note("Asistencia tuya");}}
      resetPlay();return;
    }
    if(b.y<5){b.y=5;b.vy=Math.abs(b.vy);}
    if(b.y>515){b.y=515;b.vy=-Math.abs(b.vy);}
    if(b.x<4){b.x=4;b.vx=Math.abs(b.vx);}
    if(b.x>356){b.x=356;b.vx=-Math.abs(b.vx);}
    if(!g.nopick&&Math.hypot(b.vx,b.vy)<3&&dist(b,p)<17&&p.stun<=0){b.own=true;b.by="p";g.passTo=-1;}
    if(Math.hypot(b.vx,b.vy)<2.5)g.passTo=-1;
  }
  /* compañeros */
  g.tm.forEach((t,i)=>{
    let tx=t.x,ty=t.y,s2=1.5;
    if(b.tm===i){
      t.h+=dt;tx=180;ty=60;s2=1.7;
      if((t.y<250&&t.h>.5)||t.h>2){if(t.y<300)tshoot(i);else tpass();}
    }else if(b.own){tx=p.x+(i?85:-85);ty=Math.max(120,p.y-95);}
    else if(b.tm>=0){const o=g.tm[b.tm];tx=o.x+(i?70:-70);ty=Math.max(120,o.y-60);}
    else{const dT=dist(t,b);if(dT<dist(p,b)&&dT<170){tx=b.x;ty=b.y;s2=1.9;}}
    const m=Math.hypot(tx-t.x,ty-t.y);
    if(m>3){const f2=.9+S.rv/400;t.x+=(tx-t.x)/m*s2*f2*k;t.y+=(ty-t.y)/m*s2*f2*k;}
    t.x=cl(t.x,12,348);t.y=cl(t.y,40,500);
    if(!b.own&&b.tm<0&&dist(t,b)<16&&(g.passTo===i||(!g.nopick&&Math.hypot(b.vx,b.vy)<3.2))){
      b.tm=i;t.h=0;b.vx=b.vy=0;g.passTo=-1;
    }
  });
  /* portero */
  const ks=1.3+g.lvl*0.2;
  g.k.x+=cl(b.x-g.k.x,-ks*k,ks*k);g.k.x=cl(g.k.x,goalL+8,goalR-8);
  if(!b.own&&b.tm<0&&Math.hypot(b.x-g.k.x,b.y-24)<15){b.vy=Math.abs(b.vy)+2;b.vx=(Math.random()-.5)*6;b.y=32;}
  /* defensas */
  const ds=Math.min(2,0.8+g.lvl*0.15)*(g.mode==0?1.1:g.mode==1?.9:1);
  g.d.forEach(d=>{
    if(d.out)return;
    d.cd=Math.max(0,d.cd-dt);
    const tg=b.tm>=0?g.tm[b.tm]:p;
    const tx=d.cd>0?d.x:tg.x,ty=d.cd>0?100+Math.random():tg.y;
    const m=Math.hypot(tx-d.x,ty-d.y)||1;
    if(d.cd<=0){d.x+=(tx-d.x)/m*ds*k;d.y+=(ty-d.y)/m*ds*k;}
    if(d.cd<=0){
      if(b.own&&dist(d,p)<17)tackle(d,"p");
      else if(b.tm>=0&&dist(d,g.tm[b.tm])<16)tackle(d,"t");
    }
  });
  /* árbitro */
  const r=g.ref;
  r.x=cl(r.x+cl(b.x+50-r.x,-1.1*k,1.1*k),12,348);r.y=cl(r.y+cl(b.y+35-r.y,-1.1*k,1.1*k),30,505);
}
function dot(x,c,px,py,rad,name){

    }],
    ["Cena sencilla","$150",()=>{

function socialEvent(){
  const d=S.day;
  if(d%60===30)return birthday();
  if(S.partner&&d%60===45)return partnerBday();
  if(dopeOffer())return;
  if(Math.random()>.35)return;
  const pool=["amigo","amigo","fam"];
  if(S.ex)pool.push("ex");
  if(S.partner)pool.push("pelea");
  if(S.rv<25)pool.push("vest","vest");
  const k=rnd(pool);
  if(k=="amigo")friendAsks();else if(k=="fam")familyLunch();else if(k=="ex")exAppears();else if(k=="vest")lockerFight();else partnerFight();
}


/* ---------- Casa y negocios ---------- */
let BA=[];
const HOUSES=[["Apartamento del barrio",0,0,0],["Casa en buen barrio",3000,30,5],["Mansión con piscina",12000,120,10]];
const CARS=[["Auto usado",1500,15,3,20],["Deportivo",6000,40,8,100],["Superauto",15000,90,15,300]];
const PETS=[["el perro Rocky",300],["la gata Michi",200],["el loro Pepe",250]];
const SPONS=[["Bebida energética Volt",300,80],["Botines Rayo",1000,200],["Banco del Pueblo",3000,500]];
const brandSales=()=>Math.round(40+S.fol*0.02)*(S.brandBoost>0?2:1);
function econ(){
  let inc=S.ban>0?0:LG[S.club].s,exp=HOUSES[S.house][2]+S.pets.length*8;
  S.cars.forEach(i=>exp+=CARS[i][2]);
  S.spons.forEach(i=>inc+=SPONS[i][2]);
  if(S.rest)inc+=S.rest==1?120:250;
  if(S.brand)inc+=brandSales();
  return {inc:inc,exp:exp};
}
function econDay(){
  let note="";
  if(S.spons.length&&S.rep<30){
    S.spons=[];note+=" Tus patrocinadores rompieron contrato por tu mala imagen.";
    tweet("Prensa Deportiva","@prensadep","Las marcas le dan la espalda a "+S.name+".");
  }
  const e=econ();let inc=e.inc,exp=e.exp;
  if(S.rest&&Math.random()<.1){inc-=S.rest==1?120:250;S.rep-=2;note+=" Mala reseña en tu restaurante: hoy no hubo ventas.";}
  if(S.brand&&S.rep<30)inc-=Math.round(brandSales()/2);
  if(S.pets.length&&Math.random()<.08){exp+=150;note+=" Una visita al veterinario te costó $150.";}
  if(S.brandBoost>0)S.brandBoost--;
  S.money=Math.max(0,S.money+inc-exp);
  S.stress-=HOUSES[S.house][3]+S.pets.length*4;
  if(inc||exp)note=" Hoy ingresaron $"+inc+" y gastaste $"+exp+"."+note;
  return note;
}

function closeBiz(){$('#biz').classList.remove('on');render();}
function bizAct(i){

function biz(){
  const me="@"+S.name.toLowerCase().replace(/\W/g,"");
  BA=[];
  const add=(l,s,f)=>BA.push([l,s,f]);
  const head=t=>BA.push({h:t});
  const pay=(p,f)=>()=>{const n=need(p,0);if(n)return n;S.money-=p;return f();};
  /* vivienda */
  head("Vivienda actual: "+HOUSES[S.house][0]);
  if(S.house<2){
    const h=HOUSES[S.house+1];
    add("Comprar: "+h[0],"$"+h[1]+", gastos $"+h[2]+" por día, descansas mejor",pay(h[1],()=>{
      S.house++;S.rep+=4;S.fol+=60;dj("Compraste: "+h[0]+".",1);
      tweet(S.name,me,"Nuevo hogar: "+h[0].toLowerCase()+". Del barrio hasta aquí.");
      fan("¡"+S.name+" se compró una "+(S.house==2?"mansión":"casa")+"! Cómo ha crecido el chico.");
      return "Compraste: "+h[0]+".";
    }));
  }
  /* autos */
  head("Garaje: "+(S.cars.length?S.cars.map(i=>CARS[i][0]).join(", "):"vacío"));
  CARS.forEach((c,i)=>{
    if(S.cars.includes(i))return;
    add("Comprar: "+c[0],"$"+c[1]+", gastos $"+c[2]+" por día, sube tu fama",pay(c[1],()=>{
      S.cars.push(i);S.rep+=c[3];S.fol+=c[4];
      tweet(S.name,me,"Nuevo en el garaje: "+c[0].toLowerCase()+".");
      if(i==2)fan("Un superauto para "+S.name+". Así sí se vive.");
      return "Compraste: "+c[0]+".";
    }));
  });
  /* mascotas */
  head("Mascotas: "+(S.pets.length?S.pets.map(i=>PETS[i][0]).join(", "):"ninguna"));
  if(S.pets.length<3)PETS.forEach((p,i)=>{
    if(S.pets.includes(i))return;
    add("Adoptar a "+p[0],"$"+p[1]+", $8 por día, baja el estrés al dormir",pay(p[1],()=>{
      S.pets.push(i);S.fol+=15;S.stress-=5;return "Adoptaste a "+p[0]+". La casa se llenó de alegría.";
    }));
  });
  if(S.pets.length)add("Pasear a tus mascotas","-5 energía, baja el estrés",()=>{
    const n=need(0,5);if(n)return n;
    S.energy-=5;S.stress-=6;S.fol+=10;return "Sacaste a pasear a tus mascotas. Alguien te sacó una foto y se hizo tierna en redes.";
  });
  /* patrocinios */
  head("Patrocinios (máximo 2, se rompen si tu reputación baja de 30)");
  SPONS.forEach((s,i)=>{
    if(S.spons.includes(i)){
      add("Cancelar contrato con "+s[0],"dejas de recibir $"+s[2]+" por día",()=>{S.spons=S.spons.filter(x=>x!==i);return "Cancelaste el contrato con "+s[0]+".";});
    }else if(S.fol<s[1]){
      head(s[0]+": necesitas "+s[1]+" seguidores");
    }else if(S.spons.length<2){
      add("Firmar con "+s[0],"bono $"+(s[2]*5)+" y $"+s[2]+" por día",()=>{
        S.spons.push(i);S.money+=s[2]*5;S.fol+=40;
        tweet(S.name,me,"Orgulloso de ser parte de "+s[0]+".");
        return "Firmaste con "+s[0]+" y cobraste un bono de $"+(s[2]*5)+".";
      });
    }
  });
  /* restaurante */
  head("Restaurante: "+(S.rest==0?"no tienes":S.rest==1?"Parrilla "+S.name:"Parrilla "+S.name+" (famosa)"));
  if(S.rest==0)add("Abrir un restaurante","$5000, unos $120 por día",pay(5000,()=>{
    S.rest=1;S.rep+=3;S.fol+=50;tweet(S.name,me,"Abrí mi propio restaurante: Parrilla "+S.name+". ¡Los espero!");
    return "Abriste tu restaurante.";
  }));
  else{
    if(S.rest==1)add("Ampliar el restaurante","$4000, unos $250 por día",pay(4000,()=>{S.rest=2;S.rep+=2;return "Tu restaurante ahora es famoso en la ciudad.";}));
    add("Visitar tu restaurante","-10 energía, baja el estrés",()=>{
      const n=need(0,10);if(n)return n;
      S.energy-=10;S.stress-=6;S.rep+=1;S.fol+=15;
      fan("Comí en el restaurante de "+S.name+". La carne, espectacular.");
      return "Cenaste en tu restaurante y saludaste a los clientes.";
    });
  }
  /* marca de ropa */
  head("Marca de ropa: "+(S.brand?"Ropa "+S.name+", ventas de $"+brandSales()+" por día":"no tienes"));
  if(!S.brand){
    if(S.fol<500)head("Para lanzar tu marca necesitas 500 seguidores");
    else add("Lanzar tu marca de ropa","$4000, las ventas dependen de tus seguidores",pay(4000,()=>{
      S.brand=1;S.rep+=3;S.fol+=80;tweet(S.name,me,"Nace mi marca de ropa: Ropa "+S.name+". Ya está a la venta.");
      return "Lanzaste tu marca de ropa.";
    }));
  }else add("Lanzar nueva colección","$1500, duplica las ventas por 5 días",pay(1500,()=>{
    S.brandBoost=5;S.fol+=100;S.rep+=2;tweet(S.name,me,"Nueva colección de mi marca. ¡Ya disponible!");
    return "Lanzaste una colección nueva. Las ventas se duplican por 5 días.";
  }));
  const e=econ();
  $('#bizp').innerHTML='<h2>Casa y negocios</h2><p class="st">Dinero $'+S.money+'. Ingresos por día $'+e.inc+', gastos por día $'+e.exp+'.</p><p>'+esc(S.msg)+'</p>'+BA.map((a,i)=>a.h?'<p class="st"><b>'+esc(a.h)+'</b></p>':'<button onclick="bizAct('+i+')">'+esc(a[0])+'<small>'+esc(a[1])+'</small></button>').join("")+'<button onclick="closeBiz()">Cerrar</button>';
}

function transfer(i){
  const c=LG[i],old=LG[S.club];
  if(i===S.club||val()<THR[c.t-1])return;
  const bonus=c.s*(S.ctr<=0?30:15);let m="";
  if(S.ctr>0){S.rep-=3;m+=" Dejaste a "+old.n+" con contrato vigente y la afición te silbó.";}
  S.club=i;S.dv=0;League.reset();S.clubsN++;dj("Fichaste por "+c.n+" ("+c.c+").",1);S.ctr=3;S.money+=bonus;S.stress+=10;S.fol+=c.t*40;
  if(c.t>old.t)S.rep+=3;
  if(c.c!==old.c){
    S.stress+=8;S.fam-=1;S.moved=S.day;
    m+=" Te mudaste a "+c.c+": tardarás unos 10 días en adaptarte.";
    if(S.partner)m=loveChange(-1,m+" "+S.partner+" extraña su país.");
  }
  tweet("Prensa Deportiva","@prensadep","FICHAJE: "+S.name+" llega a "+c.n+" ("+c.c+").");
  tweet(S.name,meTag(),"Nuevo capítulo. Ahora defiendo los colores de "+c.n+".");

    win=Math.random()<.45+S.skill/400+(S.stress<50?.05:0);

  }
  if(win){
    w.st++;

      S.wcTitles++;S.wcReach=6;S.wc=null;dj("¡Campeón del mundo con Colombia!",1);S.rep+=20;S.fol+=5000;S.money+=5000;

      fan("Gracias, "+S.name+". Nunca vamos a olvidar este día.");
    }else{
      S.money+=500*w.st;S.rep+=3;S.fol+=200*w.st;
      m+=" Pasaron a "+WST[w.st]+". Premio de $"+(500*w.st)+".";

function car(){

  h+='<p class="st"><b>Fichajes</b> '+(S.ctr>0?'(dejar tu club con contrato vigente cuesta reputación)':'(estás libre: prima doble)')+'</p>';
  const open=LG.map((x,i)=>({x:x,i:i})).filter(o=>o.i!==S.club&&v>=THR[o.x.t-1]).sort((a,b)=>b.x.t-a.x.t||b.x.s-a.x.s).slice(0,8);
  h+=open.map(o=>'<button onclick="transfer('+o.i+')">'+esc(o.x.n)+' ('+o.x.c+')<small>Nivel '+o.x.t+'/5, salario $'+o.x.s+' por día, prima $'+(o.x.s*(S.ctr<=0?30:15))+(o.x.c!==c.c?', en otro país':'')+'</small></button>').join("")||'<p class="st">Ningún club se interesa por ti todavía.</p>';
  const nxt=THR.find(x=>x>v);
  if(nxt)h+='<p class="st">Con valor de mercado '+nxt+' se abren clubes más grandes.</p>';
  if(S.age>=30)h+='<button onclick="retireAsk()">Retirarte del fútbol<small>Cierras tu carrera y ves tu legado</small></button>';

  $('#carp').innerHTML=h;
}
function nextWC(){let s=S.season+1;while(s%4!==3)s++;return s;}

function seasonEnd(){
  const c=LG[S.club],t=c.t,L=[];
  L.push("Temporada "+S.season+" con "+c.n+": "+S.sg+" goles en "+S.sm+" partidos y "+S.sw+" victorias.");
  dj(L[0],0);
  L.push("Reputación: afición "+Math.round(S.rf)+", prensa "+Math.round(S.rp)+", vestuario "+Math.round(S.rv)+".");
  if(S.wc){L.push("El Mundial terminó sin que lo jugaras hasta el final.");S.wc=null;}
  /* campeonato */
  L.push("Liga: terminaste "+League.pos()+"º de "+League.N()+"."+League.move());const title=S.sm>=3&&League.pos()===1;
  if(title){
    S.titles++;S.money+=t*500;S.rep+=4;S.fol+=t*120;dj("Ganaste el campeonato con "+c.n+".",1);
    L.push("¡"+c.n+" ganó el campeonato! Prima de $"+(t*500)+".");
    tweet("Prensa Deportiva","@prensadep","¡"+c.n+" campeón con "+S.name+" como protagonista!");
  }
  /* Balón de Oro */
  const mine=Math.round(S.sg*4+(S.rf*.5+S.rp*.7)+t*12+S.skill*.6+(title?35:0)+S.wcReach*12+(S.wcReach>=6?70:0));
  if(S.sm>=3&&mine>=100&&t>=2){
    const rv=["M. Duarte","L. Vargas","J. Köhler","A. Costa","R. Haddad"].map(n=>({n:n,s:130+Math.random()*90}));
    const rank=1+rv.filter(r=>r.s>mine).length;
    if(rank===1){
      S.bd++;S.rep+=10;S.fol+=2000;S.money+=3000;dj("Ganaste el Balón de Oro.",1);
      L.push("🏆 ¡BALÓN DE ORO! Eres el mejor jugador del mundo. Premio de $3000.");
      tweet("Prensa Deportiva","@prensadep","BALÓN DE ORO: "+S.name+" ya es historia del fútbol.");
      fan("El Balón de Oro es para "+S.name+". Justicia total.");
    }else if(rank<=3){
      S.rep+=2;S.fol+=300;
      L.push("Quedaste en el puesto "+rank+" del Balón de Oro. Estuviste cerca.");
    }
  }
  /* edad y rendimiento */
  if(S.age<=22){S.skill+=2;S.fit+=2;L.push("Tu juventud se nota: técnica y físico +2.");}
  else if(S.age>=34){S.skill-=2;S.fit-=4;L.push("Los años pesan: pierdes técnica y físico.");}
  else if(S.age>=31){S.skill-=1;S.fit-=2;L.push("Empiezas a notar el paso del tiempo.");}
  /* contrato */
  S.ctr=Math.max(0,S.ctr-1);
  if(S.ctr===0)L.push("Tu contrato con "+c.n+" terminó. Puedes renovar o fichar libre desde Carrera.");
  S.sg=0;S.sm=0;S.sw=0;S.wcReach=0;S.lates=0;S.season++;League.reset();
  /* selección */
  if(!S.nat&&val()>=45&&S.goals>=8){
    S.nat=true;S.rep+=5;S.fol+=400;dj("Te convocaron a la selección de Colombia.",1);
    L.push("🇨🇴 ¡Te convocaron a la selección de Colombia!");
    tweet("Prensa Deportiva","@prensadep","CONVOCADO: "+S.name+" llega a la selección nacional.");
  }else if(S.nat&&val()<38){
    S.nat=false;L.push("El seleccionador no te convocó más: tu nivel bajó.");
  }
  /* Mundial */
  if(S.season%4===3){
    if(S.nat){S.wc={st:0};L.push("⚽ ¡Comienza el Mundial! Entra a Carrera para jugarlo.");}
    else L.push("Se juega el Mundial esta temporada y no fuiste convocado.");
  }
  tweet("Prensa Deportiva","@prensadep","Arranca la temporada "+S.season+". "+S.name+" tiene "+S.age+" años.");
  clampStats();render();save();
  let b;
  if(S.age>=40)b='<button onclick="retire()">Retirarme del fútbol<small>Ya no puedes seguir: es hora de colgar los botines</small></button>';
  else b='<button onclick="closeEnd()">Seguir jugando</button>'+(S.age>=34||S.sev3>=3?'<button onclick="retire()">Retirarme del fútbol<small>Cerrar tu carrera con broche de oro</small></button>':'');
  $('#endp').innerHTML='<h2>Fin de la temporada '+(S.season-1)+'</h2>'+L.map(x=>'<p>'+esc(x)+'</p>').join("")+b;
  $('#end').classList.add('on');
}

/* ---------- Liga, calendario, posicion, rol y minutos (bloques 2 y 3) ----------
   Liga de 6 equipos a doble vuelta: una jornada cada JR dias. El equipo del jugador es el indice 0. */
const POSTS=["Delantero","Mediocampista","Defensa"],JR=6,PDESC=["tiros más fuertes","pases más rápidos","el rival marca menos"];
const League={
  tier(){return cl(LG[S.club].t+(S.dv||0),1,5);},
  fifa(){const d=Time.dayOfSeason();return d===27||d===51;},
  move(){const p=this.pos(),T=this.tier();
    if(p===1&&T<5){S.dv=(S.dv||0)+1;return " ¡Ascenso a una división superior!";}
    if(p===this.N()&&T>1){S.dv=(S.dv||0)-1;return " Descenso: pierdes la categoría.";}
    return "";},
  lg(){return S.lg||this.reset();},
  N(){return this.lg().t.length;},
  mt(){return S.mt||(S.mt={c:0,t:0,b:0,m:0,s:0,n:0});},
  reset(){
    const me=LG[S.club],T=this.tier();
    const pool=LG.filter(c=>c!==me).sort((a,b)=>(a.c===me.c?0:1)-(b.c===me.c?0:1)||Math.abs(a.t-T)-Math.abs(b.t-T)).slice(0,5);
    const t=[{n:me.n,s:T*10+8,me:1}].concat(pool.map(c=>({n:c.n,s:c.t*10+Math.round(Math.random()*8-4)})));
    t.forEach(x=>{x.p=0;x.gf=0;x.gc=0;});
    (t.slice(1).find(x=>LG.find(c=>c.n===x.n).c===me.c)||t[1]).cl=1;
    const ix=[0,1,2,3,4,5],fx=[];
    for(let r=0;r<5;r++){fx.push([0,1,2].map(i=>({a:ix[i],b:ix[5-i]})));ix.splice(1,0,ix.pop());}
    S.lg={t:t,j:fx.concat(fx.map(r=>r.map(m=>({a:m.b,b:m.a}))))};
    for(let j=0;j<10;j++)if(JR*(j+1)<Time.dayOfSeason())S.lg.j[j].forEach(m=>this.simM(m));
    return S.lg;
  },
  g(a,b){let n=0;for(let i=0;i<4;i++)if(Math.random()<cl(.22+(a-b)*.012,.08,.5))n++;return n;},
  apply(m){const t=this.lg().t,A=t[m.a],B=t[m.b];m.done=1;A.gf+=m.ga;A.gc+=m.gb;B.gf+=m.gb;B.gc+=m.ga;
    if(m.ga>m.gb)A.p+=3;else if(m.ga<m.gb)B.p+=3;else{A.p++;B.p++;}},
  simM(m){const t=this.lg().t;m.ga=this.g(t[m.a].s,t[m.b].s);m.gb=this.g(t[m.b].s,t[m.a].s);this.apply(m);},
  mine(j){return this.lg().j[j].find(m=>m.a===0||m.b===0);},
  opp(m){const x=this.lg().t[m.a===0?m.b:m.a];return x.n+(x.cl?" 🔥":"");},
  tick(){
    const d=(S.day-2)%SEASON+1;if(d===33)S.stress=Math.max(0,S.stress-10);if(d%JR)return;
    this.lg().j[d/JR-1].forEach(m=>{if(m.done)return;this.simM(m);
      if(m.a===0||m.b===0){const k=this.mt();k.b++;S.conf=cl((S.conf??40)-3,0,100);}});
  },
  rank(){return this.lg().t.slice().sort((a,b)=>b.p-a.p||(b.gf-b.gc)-(a.gf-a.gc)||b.gf-a.gf);},
  pos(){return this.rank().findIndex(x=>x.me)+1;},
  role(){const r=(S.conf??40)+val()-THR[LG[S.club].t];
    return r>=90&&S.age>=24?"Capitán":r>=65?"Figura":r>=40?"Titular":S.age<=20?"Promesa":"Suplente";},
  gate(){
    const d=Time.dayOfSeason(),j=d/JR-1,m=Number.isInteger(j)&&this.mine(j);
    if(!m){const n=Math.ceil(d/JR);return "Hoy no hay partido de liga. Próxima jornada: día "+n*JR+" contra "+this.opp(this.mine(n-1))+".";}
    if(m.done)return "Ya se jugó la jornada de hoy.";
    this.cur=m;
    const st=Math.random()<{"Capitán":1,"Figura":.95,"Titular":.85,"Promesa":.45,"Suplente":.3}[this.role()];
    this.lu={st:st,out:st&&S.conf<35&&Math.random()<.5};
    if(!st&&Math.random()<.25){this.simM(m);this.mt().b++;S.conf=cl((S.conf??40)-2,0,100);
      return "El DT no te convocó contra "+this.opp(m)+" ("+m.ga+"-"+m.gb+"). Rol actual: "+this.role()+".";}
  },
  rival(){return [this.opp(this.cur),SUR.slice().sort(()=>Math.random()-.5).slice(0,3)];},
  record(t,o,g,a,sh,ps){
    const m=this.cur,k=this.mt(),p=S.post||0;
    m.ga=m.a===0?t:o;m.gb=m.a===0?o:t;this.apply(m);
    let n=5.5+(t>o?.7:t<o?-.7:0)+(p==0?g*1.3+a*.4:p==1?g*.8+a*1.1:g*.8+a*.5+(o==0?1.3:-.3*o));
    n=this.nt=cl(Math.round(n*10)/10,1,10);
    k.c++;if(this.lu.st)k.t++;else k.b++;k.m+=this.lu.st?(this.lu.out?60:90):30;k.s+=n;k.n++;k.sh=(k.sh||0)+sh;k.ps=(k.ps||0)+ps;this.sh=sh;this.ps=ps;
    const x=this.lg().t[m.a===0?m.b:m.a];this.cls=!!x.cl;if(this.cls){S.rep+=t>o?3:t<o?-3:0;S.fol+=t>o?150:0;}
    S.conf=cl((S.conf??40)+(n-6)*4,0,100);
  },
  note(){return (this.cls?" ¡Era el clásico!":"")+(this.lu.st?(this.lu.out?" Saliste de cambio al minuto 60.":""):" Entraste desde el banco (30 min).")+" Tiros "+this.sh+", pases "+this.ps+"."+" Nota: "+this.nt+" como "+POSTS[S.post||0].toLowerCase()+". Confianza del DT: "+Math.round(S.conf)+"/100.";}
};

let RW={f:1,p:1,v:1};
function hookRep(){
  if(S.rf===undefined){const r=typeof S.rep==="number"?S.rep:50;S.rf=r;S.rp=r;S.rv=r;}
  delete S.rep;
  Object.defineProperty(S,"rep",{enumerable:true,configurable:true,
    get(){return Math.round((this.rf+this.rp+this.rv)/3)},
    set(v){
      const d=v-Math.round((this.rf+this.rp+this.rv)/3);if(!d)return;
      this.rf=cl(this.rf+d*RW.f,0,100);this.rp=cl(this.rp+d*RW.p,0,100);this.rv=cl(this.rv+d*RW.v,0,100);
    }});
}
function wrapRW(n,w){
  const o=globalThis[n];
  globalThis[n]=function(){const p=RW;RW=w;try{return o.apply(this,arguments)}finally{RW=p}};
}
wrapRW("endMatch",{f:1.5,p:.9,v:.6});

  if(S.diary.length>300)S.diary.splice(0,S.diary.length-300);
}
const DIA=[
  ["Hoy agradezco estar aquí. Del barrio hasta este camino, cada paso valió la pena.","Hoy me di cuenta de cuánta gente me apoya. No quiero olvidarlo.","Respiré hondo y agradecí lo que tengo."],

function diary(i){

/* lesiones */
const INJ=[
  {n:"esguince de tobillo",d:[4,8],sev:1},{n:"sobrecarga muscular",d:[3,7],sev:1},
  {n:"desgarro muscular",d:[10,20],sev:2},{n:"fisura de costilla",d:[12,18],sev:2},
  {n:"fractura de peroné",d:[28,40],sev:3,s:1},{n:"rotura de ligamento cruzado",d:[40,60],sev:3,s:1}
];
const injRisk=()=>.025+S.stress/2500+(S.fit<30?.03:0)+(S.age>=32?.03:0)+(S.energy<40?.02:0);
function injure(src){
  const r=Math.random(),sev=r<.55?1:r<.85?2:3,x=rnd(INJ.filter(i=>i.sev===sev));
  const d=x.d[0]+Math.floor(Math.random()*(x.d[1]-x.d[0]+1));
  S.inj={n:x.n,d:d,sev:sev,s:!!x.s,op:false};S.injN++;S.stress+=8;
  if(sev===3){S.sev3++;S.fol+=100;}
  tweet("Prensa Deportiva","@prensadep","PARTE MÉDICO: "+S.name+" sufre "+x.n+" y estará fuera unos "+d+" días.");
  fan("Ojalá que se recupere pronto, "+S.name+". ¡Fuerza!");
  dj("Lesión ("+src+"): "+x.n+", baja de "+d+" días.",sev>=2);
  return " 🚑 Te lesionaste: "+x.n+". Baja estimada: "+d+" días."+(x.s?" Los médicos hablan de operarte.":"");
}
function trainInjury(){
  if(S.inj)return false;
  if(Math.random()<.03+(S.energy<40?.05:0)+(S.stress>70?.03:0)){
    const m=injure("entrenamiento");clampStats();S.msg="Te lesionaste entrenando."+m;render();save();return true;
  }
  return false;
}
function worsenInj(){
  if(!S.inj)return "";
  if(Math.random()<.5){
    const a=6+Math.floor(Math.random()*8);S.inj.d+=a;S.stress+=5;
    if(S.inj.sev<3&&Math.random()<.3){S.inj.sev++;S.inj.s=S.inj.sev===3;if(S.inj.s)S.sev3++;}
    dj("Jugaste infiltrado y la lesión empeoró.","");
    return " Jugaste infiltrado y la lesión empeoró: +"+a+" días de baja.";
  }
  return " Aguantaste el dolor: la lesión no empeoró, pero sigue ahí.";
}
function healthDay(){
  let m="";
  if(S.inj){
    S.inj.d--;S.stress+=1;
    if(S.inj.d<=0){
      const i=S.inj;S.inj=null;
      if(i.sev>=3&&!i.op){S.fit-=5;S.skill-=2;m+=" Te dieron el alta de "+i.n+" sin haberte operado: quedaron secuelas (físico -5, técnica -2).";}
      else if(i.sev>=3){S.fit-=2;m+=" Volviste tras la operación. Aún te falta ritmo (físico -2).";}
      else m+=" Te dieron el alta médica de "+i.n+".";
      dj("Alta médica tras "+i.n+".",i.sev>=3);
      tweet("Prensa Deportiva","@prensadep","ALTA MÉDICA: "+S.name+" vuelve a los entrenamientos.");
    }else m+=" Lesión: "+S.inj.n+", faltan "+S.inj.d+" día(s).";
  }
  if(S.ban>0){S.ban--;if(S.ban===0){m+=" Terminó tu sanción por dopaje: ya puedes volver a jugar.";dj("Terminó la sanción por dopaje.",1);}}
  if(S.susp>0)S.susp--;
  if(S.burn>0){S.burn--;if(S.burn===0)m+=" Terminó tu pausa médica por agotamiento.";}
  if(S.trace>0)S.trace--;
  if(S.stress>=95&&!S.burn){
    S.burn=4;S.stress=60;S.rp=cl(S.rp-3,0,100);
    m+=" 🧠 Sufriste una crisis de agotamiento mental: 4 días de pausa médica sin jugar.";
    dj("Crisis de agotamiento mental: pausa médica de 4 días.",1);
    tweet("Prensa Deportiva","@prensadep",S.name+" se toma una pausa por motivos de salud mental.");
  }
  return m;
}

/* antidopaje y sanciones */
function antiDoping(kind){
  const p=kind==="wc"?.6:kind==="nat"?.35:.18;
  if(Math.random()>=p)return "";
  S.tests++;
  const dirty=S.trace>0,fp=!dirty&&Math.random()<.02;
  if(!dirty&&!fp)return " Control antidopaje: negativo.";
  positive(dirty);
  return " ⚠ Control antidopaje: POSITIVO.";
}
function positive(dirty){
  const ban=dirty?(S.pos>=1?180:60):20,ap=dirty?.15:.75;
  S.scand++;S.rp=cl(S.rp-(dirty?30:12),0,100);S.rf=cl(S.rf-(dirty?15:5),0,100);
  tweet("Prensa Deportiva","@prensadep","ESCÁNDALO: "+S.name+" da positivo en un control antidopaje.");
  fan("No puedo creer lo de "+S.name+". Ojalá sea un error.");
  dj("Control antidopaje positivo"+(dirty?"":" (posible contaminación)")+".",1);
  const opts=[
    ["Aceptar la sanción","Fuera "+ban+" días, multa de $2000 y sin patrocinadores",()=>applyBan(ban)],
    ["Apelar","$1000, "+Math.round(ap*100)+"% de ganar",()=>{
      if(S.money<1000)return applyBan(ban)+" No tenías dinero para apelar.";
      S.money-=1000;
      if(Math.random()<ap){S.rp=cl(S.rp+8,0,100);dj("Ganaste la apelación antidopaje.",1);return "¡Ganaste la apelación! No hay sanción, pero el daño en la prensa ya está hecho.";}
      return applyBan(ban+15)+" Perdiste la apelación y te sumaron 15 días.";
    }]
  ];
  if(dirty)opts.push(["Confesar y colaborar","sanción 40% más corta, algo de respeto",()=>{S.rp=cl(S.rp+5,0,100);return applyBan(Math.round(ban*.6))+" Tu colaboración redujo la sanción.";}]);
  ask("Tu control dio positivo. La federación te pide una respuesta: "+(dirty?"el tratamiento prohibido te delató.":"dices que fue una contaminación."),opts);
}
function applyBan(d){
  S.pos++;S.ban=d;S.trace=0;S.money=Math.max(0,S.money-2000);S.spons=[];S.fol=Math.round(S.fol*.85);
  dj("Sanción por dopaje: "+d+" días sin jugar.",1);
  if(S.pos>=3){retire();return "Tercera sanción: te suspenden de por vida.";}
  let m="Sanción: "+d+" días sin jugar ni cobrar salario, multa de $2000 y patrocinadores fuera.";
  if(S.pos>=2){S.ctr=0;m+=" Tu club rescindió tu contrato.";}
  return m;
}
function dopeOffer(){
  if(S.trace>0||S.ban>0)return false;
  if(Math.random()>=.03+(S.inj?.06:0)+(S.stress>70?.02:0))return false;
  ask("Un “doctor” sin licencia te ofrece un tratamiento milagroso: "+(S.inj?"te recuperarías mucho más rápido":"más velocidad y energía")+". Dice que “nadie lo detecta”.",[
    ["Aceptar el tratamiento","Mejoras unos días, pero es dopaje y se puede detectar hasta 25 días",()=>{
      S.trace=25;S.fit+=3;S.energy=100;S.stress+=6;if(S.inj)S.inj.d=Math.max(1,Math.ceil(S.inj.d/2));
      dj("Aceptaste un tratamiento prohibido.",1);
      return "Aceptaste el tratamiento. Te sientes imparable... pero cada control antidopaje es un riesgo.";
    }],
    ["Rechazar","",()=>{S.rep+=1;return "Lo rechazaste. Tu conciencia está tranquila.";}],
    ["Denunciarlo","sube tu imagen en la prensa",()=>{S.rp=cl(S.rp+5,0,100);S.fol+=100;dj("Denunciaste a un falso doctor que ofrecía dopaje.",0);return "Denunciaste al falso doctor. La prensa te pone de ejemplo.";}]
  ]);
  return true;
}
function lockerFight(){
  ask("El vestuario está caliente: tus compañeros dicen que juegas solo y no pasas el balón.",[
    ["Hablar con el grupo","-5 energía",()=>{S.energy-=5;S.rv=cl(S.rv+10,0,100);return "Hablaste claro y el grupo te respetó más.";}],
    ["Hacerte el duro","",()=>{S.rv=cl(S.rv-6,0,100);S.stress+=4;return "Respondiste mal. El ambiente se puso más pesado.";}],
    ["Pelear","riesgo de sanción",()=>{
      S.rv=cl(S.rv-10,0,100);S.scand++;
      if(Math.random()<.6){S.susp+=2;S.money=Math.max(0,S.money-500);dj("Pelea en el vestuario: suspendido 2 días.",1);return "Se fueron a los golpes. Sanción de 2 días y multa de $500.";}
      return "Casi llegan a los golpes, pero los separaron.";
    }]
  ]);
}

  });
  if(S.inj){
    add("Fisioterapia intensiva","$300, recorta 3 días la baja",()=>{
      const n=need(300,5);if(n)return n;S.money-=300;S.energy-=5;S.inj.d=Math.max(1,S.inj.d-3);
      return "Hiciste rehabilitación intensiva. Baja restante: "+S.inj.d+" días.";
    });
    if(S.inj.s&&!S.inj.op)add("Operarte de "+S.inj.n,"$4000, baja 40% más corta y sin secuelas graves",()=>{
      const n=need(4000,0);if(n)return n;
      S.money-=4000;S.surgs++;S.inj.op=true;S.energy=Math.max(0,S.energy-20);
      let d=Math.ceil(S.inj.d*.6);
      if(Math.random()<.12){d+=12;S.stress+=8;S.inj.d=d;dj("Cirugía de "+S.inj.n+" con complicaciones.",1);return "La operación tuvo complicaciones. Nueva baja estimada: "+d+" días.";}
      S.inj.d=d;dj("Te operaste de "+S.inj.n+" con éxito.",1);
      return "Operación exitosa. Nueva baja estimada: "+d+" días y sin secuelas graves.";
    });
  }
  add("Análisis antidopaje voluntario","$150, te dice si saldrías limpio",()=>{
    const n=need(150,0);if(n)return n;S.money-=150;
    return S.trace>0?"El análisis detecta sustancias prohibidas. Si te hacen un control, darías POSITIVO.":"El análisis sale limpio. Estás tranquilo.";
  });
  const L=[];
  L.push("Lesión: "+(S.inj?S.inj.n+" (gravedad "+S.inj.sev+"/3), faltan "+S.inj.d+" días"+(S.inj.op?", operado":""):"sano"));
  L.push("Estrés: "+S.stress+"/100"+(S.burn>0?", en pausa médica "+S.burn+" días":""));
  L.push("Riesgo de lesión por choque: "+risk+"%");
  L.push("Controles antidopaje: "+S.tests+", positivos: "+S.pos+(S.trace>0?" (sustancia detectable "+S.trace+" días)":""));
  L.push("Sanciones: "+(S.ban>0?"dopaje, "+S.ban+" días":"")+(S.ban>0&&S.susp>0?" y ":"")+(S.susp>0?"suspensión, "+S.susp+" días":"")+(S.ban<=0&&S.susp<=0?"ninguna":"")+". Impuntualidades: "+S.lates+"/3");
  L.push("Historial: "+S.injN+" lesiones ("+S.sev3+" graves), "+S.surgs+" cirugías");
  $('#hlp').innerHTML='<h2>Salud y sanciones</h2><p class="st">'+L.map(esc).join('<br>')+'</p><p>'+esc(S.msg)+'</p>'+HA.map((a,i)=>'<button onclick="hlGo('+i+')">'+esc(a[0])+'<small>'+esc(a[1])+'</small></button>').join("")+'<button onclick="closeHl()">Cerrar</button>';
}

/* finales */
function ending(){
  const rich=S.money>=50000&&S.rest&&S.brand;
  if(S.bd>=2||(S.bd>=1&&S.wcTitles>=1))return ["La leyenda inmortal","Ganaste todo lo que había que ganar. Tu nombre quedó escrito en la historia y los niños del barrio pintan tu cara en las paredes."];
  if(S.pos>=1)return ["Caída en desgracia","El dopaje manchó tu carrera. Hay quien todavía te recuerda por tus goles, pero la mayoría solo habla de la sanción."];
  if(S.sev3>=3)return ["El que pudo ser","Las lesiones te quitaron lo mejor de tus años. Los que te vieron jugar sanos dicen que habrías sido de los grandes."];
  if(S.rp<30||S.scand>=6)return ["La estrella polémica","Fuiste titular en las portadas más que en la cancha. Algunos te adoraban y otros no te perdonaron nunca los escándalos."];
  if(S.clubsN>=5&&S.rf<60)return ["El mercenario","Cambiaste de camiseta tantas veces que ninguna afición te sintió suyo. Eso sí, el dinero no te faltó."];
  if(S.rv>=75)return ["El capitán eterno","Tus compañeros te siguieron a todas partes. En cada vestuario fuiste el que unía al grupo."];
  if(S.rf>=75&&S.clubsN<=2)return ["El ídolo del pueblo","La gente te sintió suyo. Un estadio entero se pone de pie cuando alguien nombra tu apellido."];
  if(rich)return ["El empresario","Dejaste la cancha con los negocios andando: restaurante, marca de ropa y un futuro asegurado."];
  if(S.fam>=8&&S.partner&&S.love>=7)return ["El hombre de familia","Lo mejor de tu carrera fue volver a casa. Tu familia estuvo en cada tribuna."];
  return ["El muchacho del barrio","Fue una carrera honesta, de las que se cuentan en las esquinas del barrio. No lo ganaste todo, pero nunca olvidaste de dónde venías."];
}
function showRetire(){
  const e=ending(),hi=S.diary.filter(x=>x.m).slice(-8);
  $('#endp').innerHTML='<h2>'+esc(e[0])+'</h2><p>'+esc(S.name)+' se retira a los '+S.age+' años. '+esc(e[1])+'</p><p class="st">Reputación final: afición '+Math.round(S.rf)+', prensa '+Math.round(S.rp)+', vestuario '+Math.round(S.rv)+'<br>Goles: '+S.goals+' en '+S.matches+' partidos<br>Campeonatos: '+S.titles+', Balones de Oro: '+S.bd+', Mundiales: '+S.wcTitles+'<br>Clubes: '+S.clubsN+', lesiones graves: '+S.sev3+', cirugías: '+S.surgs+', sanciones por dopaje: '+S.pos+'<br>Seguidores: '+S.fol+', dinero: $'+S.money+'</p>'+(hi.length?'<p class="st"><b>Del diario</b><br>'+hi.map(x=>'Día '+x.d+': '+esc(x.t)).join('<br>')+'</p>':'')+'<button onclick="showDiary()">Leer el diario completo</button><button onclick="newCareer()">Empezar una carrera nueva</button>';
  $('#end').classList.add('on');
}
function showDiary(){
  $('#endp').innerHTML='<h2>Diario de '+esc(S.name)+'</h2>'+(S.diary.map(x=>'<p class="st">Día '+x.d+', '+x.a+' años'+(x.m?' ★':'')+'<br>'+esc(x.t)+'</p>').join("")||'<p class="st">El diario está vacío.</p>')+'<button onclick="showRetire()">Volver</button>';
}

/* ---------- Controles ---------- */
addEventListener("keydown",e=>{keys[e.key.toLowerCase()]=true;if(e.key==" "){shoot();e.preventDefault();}if(e.key.toLowerCase()=="x")pass();});
addEventListener("keyup",e=>{keys[e.key.toLowerCase()]=false;});
const cv=$('#cv');
cv.addEventListener("pointerdown",e=>{origin={x:e.clientX,y:e.clientY};joy={x:0,y:0};cv.setPointerCapture(e.pointerId);});
cv.addEventListener("pointermove",e=>{
  if(!origin)return;
  const dx=e.clientX-origin.x,dy=e.clientY-origin.y,m=Math.hypot(dx,dy);
  joy=m>10?{x:dx/m,y:dy/m}:{x:0,y:0};
  if(m>70){origin={x:e.clientX-dx/m*50,y:e.clientY-dy/m*50};}
});
const stopJoy=()=>{origin=null;joy=null;};
cv.addEventListener("pointerup",stopJoy);cv.addEventListener("pointercancel",stopJoy);
$('#shoot').addEventListener("pointerdown",e=>{e.preventDefault();shoot();});
$('#pass').addEventListener("pointerdown",e=>{e.preventDefault();pass();});


/* ---------- Pantalla ---------- */
function bar(l,v){return '<div class="m"><span>'+l+'</span><div><i style="width:'+v+'%"></i></div></div>';}
function render(){
  $('#nm').textContent=S.name;$('#dy').textContent="Día "+S.day+(S.diet>0?", dieta "+S.diet+" d":"");
  const c=LG[S.club]||LG[0];
  $('#club').textContent=c.n+" · "+c.c+" · Temporada "+S.season+" · "+S.age+" años"+(S.nat?" · Selección":"")+(S.wc?" · ¡Mundial en juego!":"")+(S.inj?" · 🚑 lesionado":"")+(S.ban>0?" · 🚫 sancionado":"")+(S.susp>0?" · 🟥 suspendido":"")+(S.burn>0?" · 🧠 pausa médica":"");
  $('#rl').textContent="Afición "+Math.round(S.rf)+" · Prensa "+Math.round(S.rp)+" · Vestuario "+Math.round(S.rv);
  $('#st').innerHTML=bar("Energía",S.energy)+bar("Físico",S.fit)+bar("Técnica",S.skill)+bar("Reputación",S.rep)+bar("Estrés",S.stress);
  $('#nums').innerHTML='<span><b>$'+S.money+'</b> dinero</span><span><b>'+S.fol+'</b> seguidores</span><span><b>'+S.goals+'</b> goles</span>';
  $('#msg').textContent=S.msg+(S.stress>70?" (Estrés alto: tu rendimiento baja.)":"");
  $('#phs').textContent=S.fol+" seguidores"+(unread()?", "+unread()+" mensajes nuevos":"");
}

Save.init();
S=load();
if(!S){S=fresh();hookRep();tweetWelcome();dj("Empieza tu camino: eres un chico de barrio con un sueño.",1);save();}else hookRep();
if(!S.news.length){newMsg("mama",0);newMsg("rep",0);newsDay();save();}
render();
if(S.retired)showRetire();

</script>
